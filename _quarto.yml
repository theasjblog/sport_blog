project:
  type: website
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!templates/**"
    - "!backlog/**"
    - "!posts/_drafts/**"
  resources:
    - "*.json"
    - "*.parquet"

execute:
  freeze: auto

website:
  title: "ASJ TRI"
  site-url: https://theasjblog.github.io/sport_blog/
  description: "Triathlon race reports, training notes, and performance records from an age-group athlete."
  favicon: /img/logo.png
  search: 
    location: navbar
    type: overlay
  cookie-consent: false
  google-analytics: "G-53CD66TT4Z"
  navbar:
    left:
    - href: index.qmd
      text: "Home"
    - href: posts/race_reports.qmd
      text: "Race Reports"
    - href: posts/others.qmd
      text: "Notes"
    - href: race_finder.qmd
      text: "Race Finder"
    - href: records.qmd
      text: "Records"
    right:
      - icon: instagram
        href: https://www.instagram.com/asj_tri?igsh=OTZ5Z2gxNGliYW1l&utm_source=qr
      - icon: strava
        href: https://www.strava.com/athletes/7974168
      - text: "{{< iconify cib:garmin >}}"
        href: https://connect.garmin.com/modern/profile/adrianstevejoseph

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header: head-icons.html
    include-after-body: gallery-lightbox.html
