<dialog id="gallery-lightbox" class="gallery-lightbox">
  <button
    type="button"
    class="gallery-lightbox__nav gallery-lightbox__nav--previous"
    aria-label="Show previous image"
  >
    &#8249;
  </button>
  <button
    type="button"
    class="gallery-lightbox__nav gallery-lightbox__nav--next"
    aria-label="Show next image"
  >
    &#8250;
  </button>
  <button
    type="button"
    class="gallery-lightbox__close"
    aria-label="Close image viewer"
  >
    ×
  </button>
  <img class="gallery-lightbox__image" alt="" />
  <p class="gallery-lightbox__caption" hidden></p>
</dialog>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const dialog = document.getElementById("gallery-lightbox");
  if (!dialog) return;

  const image = dialog.querySelector(".gallery-lightbox__image");
  const caption = dialog.querySelector(".gallery-lightbox__caption");
  const closeButton = dialog.querySelector(".gallery-lightbox__close");
  const previousButton = dialog.querySelector(".gallery-lightbox__nav--previous");
  const nextButton = dialog.querySelector(".gallery-lightbox__nav--next");

  const galleryContainers = Array.from(document.querySelectorAll(".gallery"));
  if (galleryContainers.length === 0) return;

  let currentGalleryItems = [];
  let currentIndex = -1;

  const closeDialog = () => {
    dialog.close();
    currentGalleryItems = [];
    currentIndex = -1;
    image.removeAttribute("src");
    image.alt = "";
    caption.textContent = "";
    caption.hidden = true;
  };

  const updateNavState = () => {
    const hasMultipleImages = currentGalleryItems.length > 1;
    previousButton.hidden = !hasMultipleImages;
    nextButton.hidden = !hasMultipleImages;
  };

  const resolveFullImageSrc = (src) => {
    if (!src) return "";
    return src.includes("/img/thumbnail/")
      ? src.replace("/img/thumbnail/", "/img/full/")
      : src;
  };

  const buildGalleryItems = (gallery) => {
    const items = [];

    gallery.querySelectorAll("a, img").forEach((element) => {
      if (element.tagName === "A") {
        const thumbnail = element.querySelector("img");
        const fullSrc =
          element.getAttribute("href") || resolveFullImageSrc(thumbnail?.currentSrc || thumbnail?.getAttribute("src"));

        if (!thumbnail || !fullSrc) return;

        items.push({
          trigger: element,
          fullSrc,
          alt: thumbnail.getAttribute("alt") || "",
        });
        return;
      }

      if (element.closest("a")) return;

      const src = element.currentSrc || element.getAttribute("src");
      const fullSrc = resolveFullImageSrc(src);
      if (!fullSrc) return;

      items.push({
        trigger: element,
        fullSrc,
        alt: element.getAttribute("alt") || "",
      });
    });

    return items;
  };

  const openDialog = (items, nextIndex) => {
    const selectedItem = items[nextIndex];
    if (!selectedItem) return;

    currentGalleryItems = items;
    currentIndex = nextIndex;
    updateNavState();

    image.src = selectedItem.fullSrc;
    image.alt = selectedItem.alt;

    const text = selectedItem.alt.trim();
    caption.textContent = text;
    caption.hidden = text === "";

    if (!dialog.open) {
      dialog.showModal();
    }
  };

  const showRelativeImage = (offset) => {
    if (currentIndex === -1 || currentGalleryItems.length < 2) return;

    const nextIndex =
      (currentIndex + offset + currentGalleryItems.length) % currentGalleryItems.length;
    openDialog(currentGalleryItems, nextIndex);
  };

  updateNavState();

  galleryContainers.forEach((gallery) => {
    const items = buildGalleryItems(gallery);
    if (items.length === 0) return;

    items.forEach((item, index) => {
      item.trigger.addEventListener("click", (event) => {
        if (
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        openDialog(items, index);
      }, { capture: true });
    });
  });

  closeButton.addEventListener("click", (event) => {
    event.stopPropagation();
    closeDialog();
  });

  previousButton.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    showRelativeImage(-1);
  });

  nextButton.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    showRelativeImage(1);
  });

  dialog.addEventListener("click", (event) => {
    if (event.target === dialog) {
      closeDialog();
    }
  });

  dialog.addEventListener("keydown", (event) => {
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      showRelativeImage(-1);
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      showRelativeImage(1);
    }
  });

  dialog.addEventListener("close", () => {
    image.removeAttribute("src");
  });
});
</script>
