<script>
document.addEventListener("DOMContentLoaded", () => {
  const listingItems = document.querySelectorAll(".quarto-listing .g-col-1");

  listingItems.forEach((item) => {
    const minutes = item.dataset.listingReadingTimeSort;
    if (!minutes) return;

    const attribution = item.querySelector(".card-attribution");
    if (!attribution || attribution.querySelector(".listing-reading-time")) return;

    const readingTime = document.createElement("div");
    readingTime.className = "listing-reading-time";
    readingTime.textContent = `${minutes} min read`;
    attribution.appendChild(readingTime);
  });
});
</script>
